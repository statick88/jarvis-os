# SonarQube analysis configuration for jarvis-os.
# Single source of truth: the CI workflow passes only the credential and the
# host. Every analysis property lives here, so there is one place to change.

sonar.projectKey=jarvis-os
sonar.projectName=jarvis-os

# Only Python is analyzed. The Flutter UI under jarvis_ui/ is out of scope: the
# Dart analyzer is not installed on this SonarQube instance and is a paid
# analyzer for SonarQube Server, so including it would either fail the scan or
# silently analyze nothing.
sonar.sources=jarvis_os
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12

# Generated by CI: pytest --cov-report=xml. Not committed, see .gitignore.
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/tests/**,**/__pycache__/**,**/__init__.py,**/migrations/**,**/alembic/**,**/gen/**

# sonar.organization is intentionally absent. It is a SonarQube Cloud property;
# SonarQube Server 9.9 ignores it silently rather than rejecting it, so it was
# dead config that read as if the project belonged to an organization.

# The host is environment-specific and the credential must never reach git.
# Supply both at scan time:
#   SONAR_HOST_URL=http://100.65.184.25:9000 sonar-scanner -Dsonar.login="$SONAR_TOKEN"
#
# Use -Dsonar.login, not -Dsonar.token. SonarQube Server 9.9 rejects
# "Authorization: Bearer" with 401, so the token has to travel as the Basic-auth
# username. This is the single most common cause of a 401 in this project.
sonar.host.url=${env.SONAR_HOST_URL}
