sonar.projectKey=jarvis-os
sonar.organization=statick88
sonar.sources=jarvis_os
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/tests/**,**/migrations/**,**/alembic/**,**/__pycache__/**,**/__init__.py
# Host and token are intentionally NOT set here: they are environment-specific
# and sonar.login is a credential. Supply them at scan time, never in git.
#   SONAR_HOST_URL=http://<tailscale-ip>:9100 sonar-scanner -Dsonar.token="$SONAR_TOKEN"
sonar.host.url=${env.SONAR_HOST_URL}
