  completed_at: "2026-09-06"
  artifacts:
    - path: research.md
      description: >
        Source-backed evidence report covering 6 areas: scheduler patterns
        (asyncio.create_task loops), LLM engines (no existing code, Ollama
        recommended), vault tags (VaultSearch.search with tags filter),
        skill pattern (BaseSkill ABC plugin), Flutter widgets (Riverpod
        ConsumerWidget), orchestrator API (FastAPI JSONResponse).
spec:
  status: done
  completed_at: "2026-09-06"
  artifacts:
    - path: specs/nightly/spec.md
      description: >
        6 functional requirements (RF-NIGHT-01 to RF-NIGHT-06) and 4
        non-functional requirements. Added RF-NIGHT-05 (REST endpoints)
        and RF-NIGHT-06 (Morning Briefing Widget) based on detailed proposal.
  requirements_count: 6
  nfr_count: 4
design:
  status: done
  completed_at: "2026-09-06"
  artifacts:
    - path: design.md
      description: >
        Technical architecture with 5 decisions (scheduler, skill pipeline,
        LLM engine, report format, Flutter widget), data flow diagram,
        file changes table, interfaces/contracts, testing strategy,
        threat matrix, and phased rollout plan.
  decisions:
    - area: scheduler
      decision: asyncio.create_task() periodic loop in scheduler.py
      alternatives: [cron, separate process, supervisor]
    - area: skill_pipeline
      decision: BaseSkill ABC with scan→extract→process→report pipeline
      alternatives: [one-shot, polling-based]
    - area: llm_engine
      decision: Ollama primary, llama.cpp fallback, skip if unavailable
      alternatives: [remote API fallback, single engine]
    - area: report_format
      decision: Markdown with frontmatter in _Nightly_Reports/YYYY-MM-DD.md
      alternatives: [JSON, separate directory, embedded notes]
    - area: flutter_widget
      decision: Riverpod ConsumerWidget in HomeScreen header
      alternatives: [separate screen, push notification, overlay]
