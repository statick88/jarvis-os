# Skill Frontmatter Schema (JSON Schema Draft 07)
# Validación obligatoria para todos los archivos .skills/*.md
# Ubicación: spec/contracts/skill_schema.yaml

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://jarvis-os.dev/schemas/skill-frontmatter-v1.yaml"
title: "JARVIS-OS Skill Frontmatter Schema"
version: "1.0.0"
description: "Esquema YAML frontmatter para skills en .skills/*.md. Parseado por jarvis_os/skills/loader.py"

type: "object"
required:
  - "id"
  - "name"
  - "version"
  - "description"
  - "capabilities"
  - "input_schema"
  - "output_schema"
  - "depends_on"
  - "execution"

properties:
  # === Identidad ===
  id:
    type: "string"
    pattern: "^skill\\.[a-z][a-z0-9_]*$"
    description: "Identificador único con namespace 'skill.' (ej: skill.plan, skill.bandeja)"
    examples: ["skill.plan", "skill.metricas", "skill.tendencias"]

  name:
    type: "string"
    minLength: 1
    maxLength: 50
    description: "Nombre legible para humanos"

  version:
    type: "string"
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.-]+)?$"
    description: "Versión SemVer (ej: 1.0.0, 1.2.3-beta.1)"

  description:
    type: "string"
    minLength: 10
    maxLength: 200
    description: "Descripción breve de qué hace la skill"

  author:
    type: "string"
    default: "jarvis-os team"

  license:
    type: "string"
    enum: ["MIT", "Apache-2.0", "GPL-3.0", "BSD-3-Clause"]
    default: "MIT"

  # === Capabilities (contrato de funcionalidades) ===
  capabilities:
    type: "array"
    minItems: 1
    uniqueItems: true
    items:
      type: "string"
      pattern: "^[a-z]+\\.[a-z_]+$"
    description: "Lista de capabilities que expone la skill (namespace.action)"
    examples: [["plan.create", "plan.read", "plan.update", "plan.delete", "plan.list", "plan.add_task"]]

  # === Schemas de Entrada/Salida (JSON Schema) ===
  input_schema:
    type: "object"
    description: "JSON Schema Draft 07 que valida el campo 'input' de SkillExecutionRequest"
    properties:
      type:
        const: "object"
      properties:
        type: "object"
        additionalProperties:
          type: "object"
      required:
        type: "array"
        items:
          type: "string"
      additionalProperties: false
    required: ["type", "properties", "required"]

  output_schema:
    type: "object"
    description: "JSON Schema Draft 07 que valida el campo 'output' de SkillExecutionResponse"
    properties:
      type:
        const: "object"
      properties:
        type: "object"
        additionalProperties:
          type: "object"
      required:
        type: "array"
        items:
          type: "string"
      additionalProperties: false
    required: ["type", "properties", "required"]

  # === Dependencias ===
  depends_on:
    type: "array"
    uniqueItems: true
    items:
      type: "string"
      pattern: "^skill\\.[a-z][a-z0-9_]*$"
    description: "Skills requeridas que deben cargarse antes (orden topológico)"
    default: []

  # === Configuración de Ejecución ===
  execution:
    type: "object"
    required: ["timeout_seconds", "memory_limit_mb", "cpu_limit_percent", "sandbox"]
    properties:
      timeout_seconds:
        type: "integer"
        minimum: 5
        maximum: 300
        default: 30
        description: "Timeout máximo de ejecución (kill si excede)"

      memory_limit_mb:
        type: "integer"
        minimum: 64
        maximum: 2048
        default: 256
        description: "Límite de memoria RSS (cgroups si disponible)"

      cpu_limit_percent:
        type: "integer"
        minimum: 10
        maximum: 100
        default: 50
        description: "Límite CPU relativo (100% = 1 core completo)"

      sandbox:
        type: "boolean"
        default: true
        description: "Si true, ejecutar en proceso aislado (subprocess con restricciones)"

      retries:
        type: "integer"
        minimum: 0
        maximum: 3
        default: 0
        description: "Reintentos automáticos en fallo transitorio"

      retry_backoff_ms:
        type: "integer"
        minimum: 100
        maximum: 10000
        default: 1000
        description: "Backoff exponencial entre reintentos (ms)"

  # === Health Check (opcional, para skills que exponen servidor) ===
  health:
    type: "object"
    properties:
      endpoint:
        type: "string"
        format: "uri-reference"
        description: "Endpoint HTTP relativo para health check (ej: /health)"

      interval_seconds:
        type: "integer"
        minimum: 10
        maximum: 3600
        default: 60
        description: "Intervalo entre checks"

      timeout_seconds:
        type: "integer"
        minimum: 1
        maximum: 30
        default: 5
        description: "Timeout del health check"

      expected_status:
        type: "integer"
        default: 200
        description: "Código HTTP esperado"

    additionalProperties: false

# === Ejemplos de frontmatter válido ===
examples:
  - id: "skill.plan"
    name: "Plan Diario"
    version: "1.0.0"
    description: "CRUD de prioridades diarias en wiki/plan_hoy.md"
    capabilities: ["plan.create", "plan.read", "plan.update", "plan.delete", "plan.list", "plan.add_task", "plan.complete_task"]
    input_schema:
      type: "object"
      properties:
        action:
          type: "string"
          enum: ["create", "read", "update", "delete", "list", "add_task", "complete_task"]
        task:
          type: "string"
        priority:
          type: "string"
          enum: ["low", "medium", "high", "critical"]
        task_id:
          type: "string"
      required: ["action"]
    output_schema:
      type: "object"
      properties:
        success:
          type: "boolean"
        data:
          type: "object"
        vault_changes:
          type: "array"
          items:
            type: "object"
            properties:
              path: { type: "string" }
              operation: { type: "string", enum: ["CREATE", "UPDATE", "DELETE", "APPEND"] }
              content: { type: "string" }
              frontmatter: { type: "object" }
      required: ["success"]
    depends_on: []
    execution:
      timeout_seconds: 15
      memory_limit_mb: 128
      cpu_limit_percent: 30
      sandbox: true