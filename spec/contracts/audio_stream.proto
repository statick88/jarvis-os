syntax = "proto3";

package jarvis.audio_stream.v1;

option go_package = "github.com/jarvis-os/voice-bridge/gen/go";
option java_package = "com.jarvisos.voicestream.gen";
option java_multiple_files = true;

// ============================================================================
// WebSocket Audio Streaming Messages
// ============================================================================

// Session control messages (JSON frames)
message SessionOpen {
  // Unique session identifier (UUIDv4).
  string session_id = 1;

  // Audio format: "pcm", "wav", "opus".
  string format = 2;

  // Sample rate in Hz: 16000, 22050, 44100.
  int32 sample_rate = 3;

  // VAD mode: "none", "energy", "silero".
  string vad_mode = 4;
}

message SessionAck {
  // Echoed session identifier.
  string session_id = 1;

  // True when WebSocket streaming is fully supported.
  bool websocket_enabled = 2;

  // Loaded STT model identifier.
  string stt_model = 3;

  // Default TTS voice identifier.
  string tts_voice = 4;
}

message SessionClose {
  // Unique session identifier.
  string session_id = 1;

  // Close reason: client_disconnect, server_error, idle_timeout.
  string reason = 2;
}

message ErrorMsg {
  // Unique session identifier.
  string session_id = 1;

  // Machine-readable error code.
  string code = 2;

  // Human-readable error description.
  string message = 3;
}

// ============================================================================
// STT Streaming Messages
// ============================================================================

// Audio chunk sent from client to server (binary frame = raw PCM bytes).
message AudioChunkMsg {
  // Unique session identifier.
  string session_id = 1;

  // True if this is the last chunk in the stream.
  bool is_final = 2;

  // Timestamp of first sample in chunk (Unix ms).
  int64 timestamp_ms = 3;
}

// Partial transcription result (server -> client).
message STTPartial {
  // Unique session identifier.
  string session_id = 1;

  // Partial transcribed text.
  string text = 2;

  // Confidence score (0.0 - 1.0).
  float confidence = 3;
}

// Final transcription result (server -> client).
message STTFinal {
  // Unique session identifier.
  string session_id = 1;

  // Final transcribed text.
  string text = 2;

  // Confidence score (0.0 - 1.0).
  float confidence = 3;

  // Duration of processed audio in milliseconds.
  int64 duration_ms = 4;
}

// ============================================================================
// TTS Streaming Messages
// ============================================================================

// Text chunk sent from client/LLM orchestrator to server for synthesis.
message TTSInput {
  // Unique session identifier.
  string session_id = 1;

  // Text chunk to synthesize.
  string text = 2;

  // Voice identifier.
  string voice = 3;

  // Speech rate multiplier (0.5 - 2.0).
  float speed = 4;
}

// Synthesized audio chunk (server -> client).
message TTSChunk {
  // Unique session identifier.
  string session_id = 1;

  // Audio format: "pcm", "wav", "opus".
  string format = 2;

  // Sample rate in Hz.
  int32 sample_rate = 3;

  // True if this is the last chunk in the utterance.
  bool is_final = 4;

  // Duration of this audio chunk in milliseconds.
  int64 duration_ms = 5;
}
