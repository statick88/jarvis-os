# SonarQube Quality Gate — Mobile Repository
# Place in: jarvis-mobile/.github/workflows/sonarqube.yml

name: SonarQube Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  SONAR_PROJECT_KEY: jarvis-mobile
  SONAR_ORGANIZATION: statick88

jobs:
  sonarqube-mobile:
    name: SonarQube Mobile (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: |
          flutter test --coverage --coverage-path=coverage/lcov.info

      - name: Convert coverage to SonarQube format
        run: |
          # lcov.info is already compatible
          ls -la coverage/

      - name: SonarQube Scan
      # Pinned to v6.0.0, not floating on @main/@v4.
      # CVE-2025-58178 (GHSA-f79p-9c5r-xg88, CVSS 7.8): args are treated as
      #   shell expressions; fixed in v5.3.1.
      # CVE-2025-59844 (GHSA-5xq9-5g24-4g6f): argument injection on Windows
      #   runners, bypassing the earlier fix; fixed in v6.0.0.
      # Bumping to a version below v6.0.0 reintroduces both.
      #
      # SONAR_LOGIN rather than SONAR_TOKEN: SonarQube Server 9.9 rejects
      # "Authorization: Bearer" and answers 401, so the token must travel as the
      # Basic-auth username, i.e. -Dsonar.login. The value comes from a GitHub
      # secret, so it is masked in logs.
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          # SonarQube 9.9 rejects "Authorization: Bearer"; the token must be sent as
          # the Basic-auth username, i.e. -Dsonar.login, not -Dsonar.token.
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.login=${{ env.SONAR_LOGIN }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.dart.file.suffixes=.dart
            -Dsonar.coverage.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.gr.dart,**/generated/**
            -Dsonar.qualitygate.wait=true

  quality-gate:
    name: Quality Gate Decision
    needs: [sonarqube-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Check Quality Gate status
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .sonar/report-task.txt