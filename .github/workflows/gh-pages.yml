# Deploy documentation to GitHub Pages.
#
# Source: GitHub Actions (Settings > Pages > Build and deployment).
# The github-pages environment allows branch main. Verified green 2026-10-05.
# The mkdocs configuration itself is verified: docs_dir is set,
# Placeholders resolved (statick88) and every file referenced by
# the nav exists.

name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: |
          pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
