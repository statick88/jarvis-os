# Continuous integration for jarvis-os.
#
# Replaces ci-server.yml and ci-mobile.yml. Both were written for repositories
# that do not exist (jarvis-server, jarvis-mobile) and assumed a monorepo layout
# with ./backend and ./frontend. Neither directory has ever existed here, so
# every job failed in 0s before running a single command. The frontend job also
# assumed a Node/TypeScript toolchain while jarvis_ui/ has always been Flutter.
#
# Every command below was run locally before being written here. That is the
# whole point: the previous pipeline was never green because nobody executed it.
#
# Four jobs: lint, test, skills, sast. The SAST job lives here rather than in its
# own workflow because GitHub artifacts do not cross workflow boundaries, so a
# separate sonarqube.yml could not download the coverage report and failed with
# "no artifact found". Same workflow, explicit needs: [test].
#
# Gates are ratchets, not aspirations:
#   ruff     fails on any finding not listed in .quality/ruff-baseline.txt
#   coverage fails below 57%, the measured floor
# Both are enforced as floors so they can only improve, and both name the real
# target (80% coverage, zero lint findings) in a comment rather than pretending
# to be there.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: Fail on findings outside the baseline
        # A count-based gate lets one new finding be traded for one fixed
        # finding, so regressions hide inside improvements. Diffing the exact
        # finding list means a new rule violation is always visible, even if
        # the total went down.
        #
        # LC_ALL=C on both sides is not optional. sort and comm must agree on
        # collation, and the runner's default locale orders "_" differently, so
        # comm refused the baseline with "file 1 is not in sorted order" and the
        # job failed with 60 findings on each side and nothing new between them.
        run: |
          set -uo pipefail
          LC_ALL=C ruff check jarvis_os/ --output-format concise 2>&1 \
            | LC_ALL=C grep -E '^jarvis_os/.*: [A-Z]+[0-9]+' \
            | LC_ALL=C sed 's/:[0-9]*:[0-9]*:/:/' \
            | LC_ALL=C sort > /tmp/ruff-current.txt || true

          echo "baseline: $(LC_ALL=C wc -l < .quality/ruff-baseline.txt) findings"
          echo "current:  $(LC_ALL=C wc -l < /tmp/ruff-current.txt) findings"

          NEW=$(LC_ALL=C comm -13 .quality/ruff-baseline.txt /tmp/ruff-current.txt)
          if [ -n "$NEW" ]; then
            echo "::error::new lint findings not in the baseline:"
            echo "$NEW"
            echo
            echo "Either fix them, or -- if the finding is a false positive or a"
            echo "style rule you do not want -- record the decision in ruff.toml."
            echo "Do not silence them by widening the baseline without a reason."
            exit 1
          fi

          echo "no new lint findings"

  test:
    name: Test (pytest + coverage ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # 57% is the measured floor as of this commit. The target is 80%, which
        # is what the SonarQube quality gate expects. The gap is real and
        # visible in the SonarQube dashboard; the floor exists so coverage
        # cannot silently regress while it is being closed.
        #
        # Regenerate coverage.xml on every run. A stale report is not
        # cosmetic: SonarQube aborts the whole analysis with "Line N is out of
        # range in the file X" when a referenced line no longer exists.
        run: |
          pytest tests/ --cov=jarvis_os --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=57

      - name: Upload coverage for SonarQube
        # The SAST workflow runs in a separate job and needs this artifact,
        # because regenerating coverage twice per run only invites the two
        # reports to disagree.
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  skills:
    name: Skills load and dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Every skill file must load
        # A skill with valid YAML is not a working skill. SkillFrontmatter
        # enforces the id pattern ^skill\.[a-z][a-z0-9_]*$ and the capability
        # pattern ^[a-z]+\.[a-z_]+$, and two rules that look reasonable fail
        # both: a hyphenated id, and a capability containing a digit. The
        # handler is checked too, because a skill without one registers
        # cleanly and then fails at execute time.
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from jarvis_os.skills.registry import SkillRegistry

          async def main() -> None:
              reg = SkillRegistry(skills_dir=Path(".skills"))
              count = await reg.load_from_directory()
              print(f"{count} skills loaded")

              missing = []
              for skill_id, meta in sorted(reg._skills.items()):
                  # Mirror the executor's precedence exactly:
                  #   entrypoint or frontmatter.entrypoint or default_entrypoint
                  # Checking only default_entrypoint reports a false failure for
                  # skill-bfla_idor, which declares entrypoint "bffla_idor" with a
                  # double f, and a false pass for any skill whose declared
                  # entrypoint points somewhere the default would not reach.
                  entry = (
                      meta.frontmatter.entrypoint
                      or meta.frontmatter.default_entrypoint
                  )
                  handler = Path("jarvis_os/skills/handlers") / f"{entry}.py"
                  status = "ok" if handler.exists() else "MISSING HANDLER"
                  if not handler.exists():
                      missing.append(f"{skill_id} -> {handler}")
                  print(f"  {skill_id:36} -> {entry}.py  {status}")

              if missing:
                  raise SystemExit(
                      "skills without a handler:\n  " + "\n  ".join(missing)
                  )

          asyncio.run(main())
          PY

  sast:
    name: SAST (SonarQube)
    needs: [test]
    # Runs on the self-hosted runner that lives in the same Tailscale network
    # as SonarQube (100.65.184.25:9000). The ubuntu-latest runner cannot reach
    # that address because it has no tailnet membership.
    runs-on: [self-hosted, sast]
    # No continue-on-error: this job must pass for the pipeline to be green.
    # The moment the self-hosted runner went online, the timeout against
    # 100.65.184.25:9000/api/v2/analysis/version became a real scan instead of
    # a network timeout. If this ever fails again, it is a real quality failure.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Download coverage from the test job
        # Same workflow, so the artifact is in scope. As a separate workflow
        # this step failed with 'no artifact found': artifacts do not cross
        # workflow boundaries, which is a structural limit and not a
        # configuration mistake.
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Regenerate coverage.xml with correct paths for SonarQube
        # The downloaded coverage.xml has absolute paths from the GitHub-hosted
        # runner (/home/runner/work/...) but the self-hosted runner is at
        # /opt/runner/_work/... SonarQube cannot map the file paths, so
        # coverage reads as 0%. Regenerate it locally with the correct base dir.
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/ --cov=jarvis_os --cov-report=xml --cov-report=term-missing -q

      - name: Verify coverage is present
        # A missing report makes SonarQube record zero coverage rather than
        # failing, turning a broken pipeline into a green one with a
        # misleading number.
        run: |
          test -s coverage.xml || { echo "::error::coverage.xml missing or empty"; exit 1; }
          echo "coverage.xml: $(wc -c < coverage.xml) bytes"

      - name: SonarQube scan
        # Pinned to v6.0.0, not floating on @main or @v4.
        # CVE-2025-58178 (GHSA-f79p-9c5r-xg88, CVSS 3.1 7.8): args are treated
        # as shell expressions; fixed in v5.3.1.
        # CVE-2025-59844 (GHSA-5xq9-5g24-4g6f): argument injection on Windows
        # runners, bypassing the earlier fix; fixed in v6.0.0.
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          # SonarQube Server 9.9 rejects "Authorization: Bearer" and answers
          # 401, so the token must travel as the Basic-auth username. The env
          # var is named SONAR_LOGIN rather than SONAR_TOKEN to make that
          # visible; renaming it back would look like a fix and break it.
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          # Only the credential. Every analysis property comes from
          # sonar-project.properties, so there is a single source of truth.
          args: >
            -Dsonar.login=${{ env.SONAR_LOGIN }}

      - name: Enforce quality gate
        # The scan ran in a different working directory on the self-hosted runner.
        # Find the report-task.txt and feed it to the quality gate action.
        run: |
          set -euo pipefail
          # The scan writes report-task.txt to the project base directory.
          # On the self-hosted runner, the project is at /opt/runner/_work/jarvis-os/jarvis-os
          REPORT_TASK="/opt/runner/_work/jarvis-os/jarvis-os/.sonar/report-task.txt"
          if [ ! -f "$REPORT_TASK" ]; then
            # Fallback: search for it
            REPORT_TASK=$(find /opt/runner/_work -name "report-task.txt" -type f 2>/dev/null | head -1)
          fi
          if [ ! -f "$REPORT_TASK" ]; then
            echo "::error::report-task.txt not found"
            exit 1
          fi
          echo "Found report-task.txt at $REPORT_TASK"
          echo "REPORT_TASK=$REPORT_TASK" >> $GITHUB_ENV

      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: ${{ env.REPORT_TASK }}
