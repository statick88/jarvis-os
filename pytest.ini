[pytest]
# asyncio_mode = auto lets async fixtures and async tests work without
# decorating each one with @pytest.mark.asyncio. Without it, a plain
# @pytest.fixture async generator fails with "requested an async fixture with no
# plugin or hook that handled it".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
